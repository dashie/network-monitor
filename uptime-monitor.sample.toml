# uptime-monitor configuration.
#
# Every key below can also be given on the command line, where it wins over this
# file (FR-2). The effective configuration after the merge is printed by
# `uptime-monitor --show-config`.

# Notification channels (FR-25): declare a channel once with a unique `name`, then
# enable it by name. The root `notify` list enables channels for global events and as
# the default for every target; a target's `notify` list replaces it, and
# `notify = []` silences the target. A declaration holds secrets, so it is read from
# this file only and every rendering of a secret reads `<redacted>`. The runbook is
# docs/NOTIFICATIONS.md.
#
# notify = ["telegram"]
#
# [[notification]]
# name = "telegram"
# type = "telegram"
# bot_token = "123456789:replace-me"
# chat_id = "-1001234567890"
# stabilize_seconds = 60
#
# [[notification]]
# name = "hook"
# type = "webhook"
# url = "https://automation.example.test/hooks/uptime-monitor"
# token = "replace-me"          # optional, and only with an https URL
#
# [[notification]]
# name = "audit"
# type = "logfile"
# filename = "/var/log/uptime-monitor/audit.log"
# logger = "notification"
# level = "info"
# format = "jsonl"              # or "text"
# max_bytes = 10485760          # rotate at 10 MiB; 0 (the default) never rotates
# max_files = 5                 # keep audit.log.1 … audit.log.5

# Probe interval in milliseconds. Every target may state its own `interval_ms`.
interval_ms = 5000

# Maximum wait for an answer, in milliseconds. Every target may state its own
# `timeout_ms`.
timeout_ms = 2000

# Minimum monitor downtime recorded as unknown. The last known state is closed as
# unknown and the first probe after the gap records the observed state. 0 disables.
gap_after_ms = 60000

# Consecutive failed probes before a target is recorded down. 1 (the default) records
# the first failure at once. Every target may state its own `down_after`.
down_after = 1

# A reachable target whose round-trip time stays at or above `degraded_after_ms` for
# `degraded_after` consecutive probes is recorded `degraded` instead of `up`, and returns
# to `up` after as many probes below it. 0 (the default) keeps the state off. Every
# target may state its own pair.
degraded_after_ms = 0
degraded_after = 3

# The page the monitor serves when --listen is absent. Without this key and without
# --listen, no page is served. `serve` and `simulate` ignore this key and keep their
# own --listen flag.
# listen = "127.0.0.1:8642"

# SQLite event database. A relative path is relative to this file, not to the working
# directory. Keep it on a local filesystem: WAL is not supported on network shares.
database = "./tmp/uptime-monitor.db"

# Delete events older than this many days. 0 keeps every event.
retention_days = 0

# ICMP echo request, the default method. `interface` is optional: without it the
# default-route interface is used. `priority` (optional) orders the lanes of the page:
# the targets that state one come first, the lowest number first, and the others follow
# by key. Two targets may state the same priority: the key then breaks the tie.
[[targets]]
method = "icmp"
ip = "1.1.1.1"
# interface = "eth1"
label = "cloudflare-dns"
priority = 1
# notify = ["telegram", "audit"]   # replaces the root list for this target
# down_after = 3                   # a flaky link needs three real failures
# degraded_after_ms = 200          # reachable but slow at or above 200 ms
# degraded_after = 3               # three slow probes to enter, three fast ones to leave


[[targets]]
ip = "192.168.1.1"

# TCP: the handshake completing is `up`. `host` may be an address or a name;
# `interface` is allowed here too.
[[targets]]
method = "tcp"
host = "1.1.1.1"
port = 443
label = "cloudflare-https"
timeout_ms = 1000

# DNS: asks one server when `resolver` is given, otherwise the system resolver.
# `record` is A (the default) or AAAA.
[[targets]]
method = "dns"
name = "example.com"
resolver = "9.9.9.9"
record = "A"
label = "example-via-quad9"

[[targets]]
method = "dns"
name = "example.com"
label = "example-system"

# HTTP: one GET, no redirect. `expect_status` defaults to 200-399 and accepts
# classes (`2xx`) and exact codes.
[[targets]]
method = "http"
url = "https://example.com/health"
expect_status = ["200", "3xx"]
label = "example-health"
