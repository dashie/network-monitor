[package]
name = "network-monitor"
version = "0.10.0"
edition = "2021"
rust-version = "1.75"
description = "Event-based reachability monitor with ICMP, TCP, DNS, and HTTP checks and an embedded SQLite history"
license = "MIT"
publish = false

[[bin]]
name = "network-monitor"
path = "src/main.rs"

[lib]
name = "network_monitor"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
socket2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Container and local builds: the release optimisations with thin LTO and parallel
# codegen units, which keep the link step short on the NAS that builds the image.
# Published artifacts keep the `release` profile.
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
