# Self-contained compose project for network-monitor: nothing has to exist before
# the first run — no configuration file, no volume, no image — so the same file
# works on the machine that holds the sources and on a remote Docker context.
#
#   docker -c qubo compose up -d --build   # build, recreate, start
#   docker -c qubo compose logs -f
#   docker -c qubo compose down            # stop and remove, keep the volume
#
# The page is served by the monitor process itself, so one container records and
# shows: see `--listen` in the command below.
#
# The configuration is not a file on the host: it is the `content` of the
# `monitor-config` config at the bottom of this file, mounted over the default one.
# The content travels with the project — also when compose talks to a remote daemon —
# so the image stays the generic one and no bind mount has to exist on the NAS. Edit
# that block to change what is probed. Inline `content` needs Compose 2.23.3 or newer;
# on an older Compose point `file:` at a checked-in TOML instead (both are copied to
# the daemon).

services:
  network-monitor:
    # Built from the Dockerfile in this directory when the image is missing, and
    # rebuilt by `--build`. Development tag; tag the same image with the release
    # version when publishing.
    build: .
    image: network-monitor:dev
    container_name: network-monitor
    restart: unless-stopped

    # Host networking is what makes `interface = "eth1"` mean the physical
    # interface of the NAS. With the default bridge the container gets its own
    # eth0 on a virtual network and the NAS interfaces are not visible. It also
    # means the page listens on the NAS address directly, with no port to publish:
    # open http://<nas>:8642/ . Never add `ports` next to this setting, Docker
    # ignores it.
    #
    # Linux only: this file is for the NAS, not for Docker Desktop on macOS, where
    # host networking is not supported.
    network_mode: host

    # Opening a raw ICMP socket is the only privileged operation.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW

    volumes:
      # Event database. Created on first use and kept across recreations; the
      # history survives `compose down` because the volume is named.
      - network-monitor-data:/var/lib/network-monitor

    configs:
      - source: monitor-config
        target: /etc/network-monitor/config.toml

    # The configuration comes from the mount above; `--listen` has no key in the file.
    command:
      - monitor
      - --config
      - /etc/network-monitor/config.toml
      - --listen
      - 0.0.0.0:8642

configs:
  monitor-config:
    # One probe per second per target: a drop is noticed within the 2 s timeout that
    # `network-monitor` uses by default, instead of within five seconds. The interval is
    # the pause after a probe, so an answering target is probed every ~1 s and a silent
    # one every ~3 s (2 s timeout + 1 s pause). Only transitions are written, so the
    # database grows with incidents, not with probes.
    #
    # `database` must stay on the mounted volume, and labels travel with the target:
    # every transition rewrites the target row, so a label given only to an imported
    # history is lost at the first live drop.
    content: |
      interval_ms = 1000
      timeout_ms = 2000
      database = "/var/lib/network-monitor/events.db"
      retention_days = 0

      [[targets]]
      ip = "1.1.1.1"
      interface = "eth1"
      label = "cloudflare-dns"

      [[targets]]
      ip = "192.168.1.1"
      label = "gateway"

      # Websites: one GET every 30 s, up when the status is in the default 200-399
      # range (a refusal, a timeout, or a TLS failure is down).
      [[targets]]
      method = "http"
      url = "https://www.xthema.it"
      interval_ms = 30000
      label = "xthema-it"

      [[targets]]
      method = "http"
      url = "https://www.h7labs.it"
      interval_ms = 30000
      label = "h7labs-it"

volumes:
  # Explicit name: without it Compose prefixes the volume with the project name and
  # the monitor would start from an empty history.
  network-monitor-data:
    name: network-monitor-data
